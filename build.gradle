plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        // FTB's maven -- hosts FTB Quests, FTB Library, FTB Teams.
        // Verify the exact coordinates/versions of the dependencies below
        // against this maven on first sync (browse it in a web browser):
        // https://maven.ftb.dev/releases/dev/ftb/mods/
        url = "https://maven.ftb.dev/releases"
    }
    maven {
        // Architectury -- FTB's runtime dependency.
        url = "https://maven.architectury.dev/"
    }
    maven {
        // JEI -- hosts the Just Enough Items API + mod jar.
        url = "https://maven.blamejared.com/"
    }
    maven {
        // Modrinth's maven -- used only to pull SoulHome into the dev run.
        // Coordinates are "maven.modrinth:<project id or slug>:<version id or number>".
        url = "https://api.modrinth.com/maven"
        content {
            // Modrinth's maven returns 200-with-HTML for unknown paths rather than 404, which
            // makes Gradle report confusing parse errors when an unrelated dependency misses in
            // an earlier repo and falls through to here. Restrict it to the one group it serves.
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // A second client, for testing anything that needs two players in the world at once --
        // the cross-dimension sleep rules in the soulhome package are the reason this exists,
        // since "does the night pass when only one of two players sleeps" can't be exercised solo.
        //
        // Usage: start `server`, then `client` and `clientAlt`, and connect both to localhost.
        // run/server.properties already has online-mode=false, which is required -- dev clients
        // aren't authenticated against Mojang and a normal server would reject them.
        //
        // The separate gameDirectory is not optional: two clients sharing run/ would fight over
        // options.txt, latest.log, and the mod's own config + wishlist files, which is exactly the
        // sort of thing that produces confusing results in a test.
        clientAlt {
            client()
            programArguments.addAll '--username', 'Player2'
            gameDirectory = project.file('run-client-alt')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // --- FTB Quests (optional styling feature) ---------------------------
    // Compile against FTB Quests + its dependencies so the mixins can see
    // the real classes. FTB Quests is All Rights Reserved -- do NOT bundle
    // these jars into a public release; they're dev/compile-time only.
    //
    // IMPORTANT: the exact artifact coordinates and the transitive
    // ftb-library / ftb-teams versions that pair with Quests 2101.1.27 must
    // be confirmed against FTB's maven on first sync. If any of these fail
    // to resolve, browse https://maven.ftb.dev/releases/dev/ftb/mods/ to
    // read the real group path + available versions and adjust. If maven is
    // painful, drop the jars in ./libs and use the files(...) form instead:
    //   implementation files("libs/ftb-quests-neoforge-2101.1.27.jar")
    // Coordinates verified 2026-07-01 against ftb-quests-neoforge:2101.1.27's
    // published POM on https://maven.ftb.dev/releases -- it declares these exact
    // ftb-library / ftb-teams versions as compile dependencies.
    implementation "dev.ftb.mods:ftb-quests-neoforge:2101.1.27"
    implementation "dev.ftb.mods:ftb-library-neoforge:2101.1.31"
    implementation "dev.ftb.mods:ftb-teams-neoforge:2101.1.9"

    // --- FTB Chunks (optional world map / minimap disable feature) --------
    // Same ARR/visible-source deal as FTB Quests above -- compile-time only,
    // never bundled. Pinned to the same 2101.x family as the FTB Quests/Library/
    // Teams versions above (rather than the newer 2111.x line) because its POM
    // declares ftb-teams-neoforge:2101.1.9 (exact match with the pin above) and
    // ftb-library-neoforge:2101.1.30 (same minor family as the 2101.1.31 pinned
    // above); 2111.x pulls in ftb-library/ftb-teams:2111.1.0 instead, which would
    // conflict with the pins above. Coordinates verified 2026-07-09 against
    // ftb-chunks-neoforge:2101.1.20's published POM on https://maven.ftb.dev/releases.
    implementation "dev.ftb.mods:ftb-chunks-neoforge:2101.1.20"

    // --- JEI (optional, no custom integration -- just lets JEI see our items/recipes) --------
    // The JEI API is declared for compile time use only; the full JEI mod is runtime-only and
    // never bundled. Nothing in this mod hard-references JEI classes, so it loads fine without
    // JEI installed at all -- these are just enough to let the mod compile against JEI's API and
    // to pull JEI into the dev run so recipes/hats can be checked in-game.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // --- Runelic (optional, runic identification font) ---------------------------------------
    // Runelic is "all rights reserved" (Darkhax) -- same category as FTB Quests above, so it's
    // never bundled, just compileOnly/runtimeOnly + declared optional in neoforge.mods.toml.
    // Only the font's ResourceLocation ("runelic:runelic") and ModList.get().isLoaded("runelic")
    // are referenced in code, so no actual Runelic Java class is imported anywhere -- compileOnly
    // here is mostly for dev-run convenience (so runtimeOnly pulls it into the dev client).
    // Coordinates verified 2026-07-01 against https://maven.blamejared.com/net/darkhax/runelic/runelic-neoforge-1.21.1/
    // (same maven repo already declared above for JEI) -- latest version there is 21.1.5;
    // re-verify if Runelic has revved since.
    compileOnly "net.darkhax.runelic:runelic-neoforge-1.21.1:21.1.5"
    runtimeOnly "net.darkhax.runelic:runelic-neoforge-1.21.1:21.1.5"

    // --- SoulHome (optional, per-player pocket dimension we patch weather + sleeping for) -------
    // All Rights Reserved (LeafReynolds) -- same category as FTB Quests and Runelic above, so it's
    // never bundled. runtimeOnly with no compileOnly counterpart on purpose: the soulhome package
    // references SoulHome purely by resource location and never imports one of its classes, so
    // there is nothing to compile against. This exists solely so the dev run actually has a soul
    // home dimension to test in.
    //
    // "fM507At5" is the Modrinth version id of SoulHome-Mod-1.21.1-21.1.172-b14.jar (the latest
    // 1.21.1 NeoForge build as of 2026-07-20). A version *id* is pinned rather than a version
    // number because SoulHome's version numbers on Modrinth are mislabeled -- b14 is published
    // under the version number "1.20.1.14" despite being the 1.21.1 build.
    runtimeOnly "maven.modrinth:xIDoUI7f:fM507At5"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}